<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lavagna a mano libera</title>
  <script defer src="./assets/index-DH_y_m7C.js"></script>
  <link rel="stylesheet" href="./assets/style-DYkjn_dh.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#20252c">
  <meta name="description" content="Lavagna per scrivere a mano libera con la penna.">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div id="board">
  <div id="dots"></div>
  <div id="layers"></div>
  <div id="world"></div>
  <canvas class="live" id="liveHl"></canvas>
  <div id="hint"><strong>Il foglio è pronto</strong>Scrivi con la penna. Tieni premuto il tasto destro e trascina per spostare il foglio.</div>
  <div id="ring" hidden></div>
</div>

<div id="tray" role="toolbar" aria-label="Strumenti">
  <div class="group" id="tools">
    <button class="btn" id="t-pen" data-tool="pen" title="Penna (P)" aria-label="Penna"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.6 4a2.1 2.1 0 0 1 3 0l.4.4a2.1 2.1 0 0 1 0 3L8.6 18.8 4 20z"/><path d="M14.5 6.2l3.3 3.3"/></svg></button>
    <button class="btn" id="t-hl" data-tool="hl" title="Evidenziatore (E)" aria-label="Evidenziatore"><svg viewBox="0 0 24 24"><path d="M9 14.5l-2.2 2.2 1.5 1.5L10.5 16"/><path d="M8 12.5L16.5 4l4.5 4.5-8.5 8.5a1.5 1.5 0 0 1-2.1 0L8 14.6a1.5 1.5 0 0 1 0-2.1z"/><path d="M3 21h9"/></svg></button>
    <button class="btn" id="t-er" data-tool="er" title="Gomma (G)" aria-label="Gomma"><svg viewBox="0 0 24 24"><path d="M8.5 20L3.9 15.4a1.8 1.8 0 0 1 0-2.5l8.8-8.8a1.8 1.8 0 0 1 2.5 0l5 5a1.8 1.8 0 0 1 0 2.5L12 20z"/><path d="M8.3 8.6l7.1 7.1"/><path d="M8.5 20H20"/></svg></button>
    <button class="btn" id="t-tx" data-tool="tx" title="Testo (T)" aria-label="Testo"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></button>
    <button class="btn" id="t-se" data-tool="se" title="Selezione (V)" aria-label="Selezione"><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M12 4h1M4 12v1M4 17v1.5A1.5 1.5 0 0 0 5.5 20H7M17 4h1.5A1.5 1.5 0 0 1 20 5.5V7"/><path d="M11 11l9 3.4-3.9 1.7L14.4 20z"/></svg></button>
  </div>
  <div class="rule"></div>
  <div class="group" id="colors" role="radiogroup" aria-label="Colore"></div>
  <div class="rule" id="colorRule"></div>
  <div class="group" id="sizeBox">
    <div id="sizeDotBox"><div id="sizeDot"></div></div>
    <input type="range" id="sizeRange" aria-label="Spessore">
    <span id="sizeVal"></span>
  </div>
  <div class="rule" id="sizeRule"></div>
  <div class="group" id="zoomBox">
    <input type="range" id="zoomRange" min="-2" max="2" step="0.01" value="0" aria-label="Zoom">
    <button class="btn" id="zoomVal" title="Riporta al 100% (Ctrl+0)" aria-label="Riporta lo zoom al 100%">100%</button>
  </div>
  <div class="rule"></div>
  <div class="group">
    <button class="btn" id="open" title="Apri una lavagna, importa un PDF o un'immagine (Ctrl+O)" aria-label="Apri una lavagna, importa un PDF o un'immagine"><svg viewBox="0 0 24 24"><path d="M3.5 18.5V6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h6.5A1.5 1.5 0 0 1 19 9v1.5"/><path d="M3.5 18.5l2.8-7A1.5 1.5 0 0 1 7.7 10.5H20a1 1 0 0 1 .9 1.4l-2.5 6.1a1.5 1.5 0 0 1-1.4 1H4.5a1 1 0 0 1-1-.5z"/></svg></button>
    <button class="btn" id="save" title="Salva su file (Ctrl+S)" aria-label="Salva su file"><svg viewBox="0 0 24 24"><path d="M5.5 4h10.2L20 8.3v10.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13A1.5 1.5 0 0 1 5.5 4z"/><path d="M8 4v5h7V4"/><path d="M7.5 20v-6.5h9V20"/></svg></button>
    <button class="btn" id="undo" title="Annulla (Ctrl+Z)" aria-label="Annulla"><svg viewBox="0 0 24 24"><path d="M8.5 5L4 9.5 8.5 14"/><path d="M4 9.5h10.5a5 5 0 0 1 0 10H9"/></svg></button>
    <button class="btn" id="redo" title="Ripeti (Ctrl+Y)" aria-label="Ripeti"><svg viewBox="0 0 24 24"><path d="M15.5 5L20 9.5 15.5 14"/><path d="M20 9.5H9.5a5 5 0 0 0 0 10H15"/></svg></button>
    <button class="btn" id="clear" title="Pulisci il foglio" aria-label="Pulisci il foglio"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l.9 12.5h9.2L17.5 7"/></svg></button>
    <button class="btn" id="lowLat" title="" aria-label="Bassa latenza"><svg viewBox="0 0 24 24"><path d="M13 3L5.5 13.5H11L10 21l8.5-11H13z"/></svg></button>
    <button class="btn" id="info" title="Nome e statistiche del foglio (I)" aria-label="Nome e statistiche del foglio" aria-pressed="false" aria-controls="panel"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V5M15 20v-9M20 20v-5"/></svg></button>
    <button class="btn" id="clean" title="Vista pulita per lo screenshot (O)" aria-label="Vista pulita per lo screenshot"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="btn" id="full" title="Schermo intero (F)" aria-label="Schermo intero"><svg viewBox="0 0 24 24"><path id="fullPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<section id="panel" aria-label="Foglio" hidden>
  <div class="panel-head">
    <label for="sheetName">Nome del file</label>
    <button class="btn" id="panelClose" title="Chiudi (Esc)" aria-label="Chiudi il pannello"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <input type="text" id="sheetName" spellcheck="false" autocomplete="off">
  <table id="stats">
    <thead><tr><th>Contenuto</th><th class="num">Quantità</th><th class="num">Peso</th><th class="num pct"></th></tr></thead>
    <tbody id="statsBody"></tbody>
    <tfoot><tr><th>Totale</th><td class="num" id="statsTotN"></td><td class="num" id="statsTotB"></td><td></td></tr></tfoot>
  </table>
  <dl id="statsFacts"></dl>
</section>
<input type="file" id="fileInput" accept=".json,application/json,.pdf,application/pdf,.png,.jpg,.jpeg,.webp,.gif,image/*" aria-label="Scegli una lavagna, un PDF o un'immagine" hidden>
<div id="toast" role="status" hidden></div>
</body>
</html>
